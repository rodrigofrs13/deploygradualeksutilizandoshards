# values/argocd.yaml
global:

  domain: argocd.internal.example.com   # TODO: troque pelo domínio real (ex.: argocd.dev.seudominio.com.br).

  nodeSelector:
    karpenter.sh/nodepool: general-purpose

configs:
  params:
    server.insecure: false
  cm:
    timeout.reconciliation: 180s
    application.instanceLabelKey: argocd.argoproj.io/instance

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi


server:
  replicas: 1

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external" # É é o único valor válido reconhecido pelo controller
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip" # É o recomendado com Auto Mode/Karpenter: os targets do NLB apontam direto para o IP do pod
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing" # Expor publicamente o NLB.
    loadBalancerClass: "eks.amazonaws.com/nlb"
    externalTrafficPolicy: Local # preserva o IP real do cliente, o Argo CD veria o IP do node em vez do IP do usuário.

  ingress: # Ingress desabilitado: a exposição deste ambiente é via Service type=LoadBalancer (NLB)
    enabled: false


repoServer:
  replicas: 1


redis:
  enabled: true


