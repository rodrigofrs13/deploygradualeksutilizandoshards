# values/argo-workflows.yaml


# UI/API acessível sem exigir login SSO/client (--auth-mode=server).
server:
  extraArgs:
    - "--auth-mode=server"

  # NLB
  serviceType: LoadBalancer
  serviceAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external" # É o único valor válido reconhecido pelo controller embutido do EKS Auto Mode (junto com "nlb-ip", legado).
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip" # Recomendado com Auto Mode/Karpenter: os targets do NLB apontam direto para o IP do pod, em vez do IP do node.
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing" # "internet-facing" = acesso público
  loadBalancerClass: "eks.amazonaws.com/nlb"
