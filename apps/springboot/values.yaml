service:
  port: 80
  targetPort: 8080

canary:
  # pause SEM "duration" = pausa indefinida: o Argo Rollouts NÃO promove
  # sozinho depois de X segundos, fica parado em 50% até alguém rodar
  # manualmente `kubectl argo rollouts promote springboot -n <shard>`
  # (ou `... --full` pra pular direto pra 100%). Aprovação manual em TODO
  # canário, dentro de cada shard — não só entre shards.
  steps:
    - setWeight: 50
    - pause: {}
    - setWeight: 100
