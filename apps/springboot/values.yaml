# Default para "helm template"/"helm install" manual, sem o ArgoCD. Em
# produção, o ApplicationSet (terraform/platform/argocd-applicationset.tf)
# sobrescreve os dois por shard via spec.source.helm.parameters — precisam
# bater com o label/taint "shard" dos NodePools (terraform/platform/nodepools.tf).
shard: shard-1
namespace: shard-1

replicas: 4

image:
  repository: 246732148991.dkr.ecr.us-east-1.amazonaws.com/eks-automode-app-dev
  tag: "fa50a9a"


service:
  port: 80
  targetPort: 8080

canary:
  # pause SEM "duration" = pausa indefinida: o Argo Rollouts NÃO promove
  # sozinho depois de X segundos, fica parado em 50% até alguém rodar
  # manualmente `kubectl argo rollouts promote springboot -n <shard>`
  # (ou `... --full` pra pular direto pra 100%). Aprovação manual em TODO
  # canário, dentro de cada shard — não só entre shards.
  steps:
    - setWeight: 50
    - pause: {}
    - setWeight: 100

# Controla como a promoção da shard-1 (já 100%/Healthy) para shard-2 acontece, dentro do WorkflowTemplate build-push-springboot
# (terraform/platform/argoworkflows-template.tf). Ler/trocar isso é só editar este arquivo e dar commit/push — não precisa de terraform apply
# novo, o Workflow lê esse valor direto do repositório clonado a cada execução.
promotion:
  # true  = aprovação AUTOMÁTICA: o Workflow consulta o CloudWatch Alarm abaixo depois que a shard-1 chegar a Healthy — se o estado for
  #         OK, promove a shard-2 sozinho; se for ALARM ou INSUFFICIENT_DATA, aborta (rollback) o rollout da shard-1.
  # false = aprovação MANUAL (como era antes): o Workflow fica suspenso na UI do Argo Workflows até alguém clicar "Resume".
  automaticApproval: true
  # Nome do CloudWatch Alarm consultado quando automaticApproval=true.
  # Criado em terraform/platform/cloudwatch-alarm.tf — hoje é um alarme de TESTE (métrica própria, sem nada publicando nela ainda); veja o
  # comentário desse arquivo pra saber como forçar cada estado manualmente  pra testar o fluxo automático.
  cloudWatchAlarmName: "eks-automode-dev-springboot-shard1-health"
