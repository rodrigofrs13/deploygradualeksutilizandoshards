# Default para "helm template"/"helm install" manual, sem o ArgoCD. Em
# produção, o ApplicationSet (terraform/platform/argocd-applicationset.tf)
# sobrescreve os dois por shard via spec.source.helm.parameters — precisam
# bater com o label/taint "shard" dos NodePools (terraform/platform/nodepools.tf).
shard: shard-1
namespace: shard-1

replicas: 3

image:
  repository: 246732148991.dkr.ecr.us-east-1.amazonaws.com/eks-automode-app-dev
